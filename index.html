<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=contain">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>金价监控</title>
  <style>
    :root {
      --app-height: 100vh; /* 通过 JS 动态更新，保证移动端高度准确 */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --change-up-color: #e76b67;
      --change-down-color: #4cd186;
      --change-neutral-color: #c28c13;
    }
    html,
    body {
      overflow: hidden; /* 禁止任何滚动行为 */
      overscroll-behavior: none; /* 防止触顶/触底回弹 */
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0; /* 灰白色背景 */
      color: #d4af37; /* 金色文字 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: var(--app-height);
      transition: background-color 0.3s;
      position: relative;
      touch-action: manipulation; /* 禁止滚动手势但保留点击 */
    }
    #backgroundChart {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }
    .container {
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1.2em;
      width: min(90vw, 80%);
      padding-left: max(18px);
      padding-right: max(18px);
      box-sizing: border-box;
      height: 100%;
      position: relative;
      z-index: 1;
    }
    .price {
      font-size: 5vw; /* 默认字体 */
      font-weight: bold;
      margin-top: -30px;
    }
    .time {
      font-size: 2vw; /* 时间文字大小 */
      margin-top: -1em;
    }
    .status {
      font-size: 2.4vw;
      font-weight: 600;
      display: flex;
      gap: 0.4em;
      align-items: center;
    }
    .status.stopped {
      color: #c0392b;
    }
    .status.active {
      color: #27ae60;
    }
    .history-status { color: #a36b38; font-size: 12px; line-height: 1.3; }
    .history-status:empty { display: none; }
    .change-board {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.8em;
      margin-top: 0.6em;
    }
    .change-card {
      background: rgba(255, 255, 255, 0.36);
      border-radius: 14px;
      padding: 0.45em 1.1em;
      display: flex;
      flex-direction: column;
      gap: 0.35em;
      backdrop-filter: blur(10px);
      box-shadow: 0 16px 36px rgba(212, 175, 55, 0.18),
                  inset 0 0 0 1px rgba(255, 255, 255, 0.274);
      position: relative;
      cursor: pointer;
    }
    .change-card .period {
      font-size: 1.9vw;
      color: rgba(222, 172, 45, 0.885);
    }
    .change-card .change-value {
      font-size: 2.4vw;
      font-weight: 700;
      color: var(--change-neutral-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55em;
      line-height: 0.8;
      text-align: left;
      transition: color 0.2s ease;
      padding: 0.15em 0;
    }
    .change-card .change-value.change-up {
      color: var(--change-up-color);
    }
    .change-card .change-value.change-down {
      color: var(--change-down-color);
    }
    .change-card .change-value.change-flat {
      color: var(--change-neutral-color);
    }
    .change-card .change-arrow {
      font-size: 3vw;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 1em;
    }
    .change-card .change-lines {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25em;
    }
    .change-card .change-line:first-child {
      font-size: 2.4vw;
    }
    .change-card .change-line:last-child {
      font-size: 2vw;
      font-weight: 600;
      opacity: 0.85;
    }
    .change-card .change-extra {
      font-size: 1.6vw;
      color: rgba(238, 196, 58, 0.885);
    }
    .change-card .indicator {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(180, 180, 180, 0.35);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .change-card.active .indicator {
      background: rgba(246, 196, 76, 0.85);
      box-shadow: 0 0 8px rgba(246, 196, 76, 0.75), inset 0 0 0 1px rgba(255, 255, 255, 0.65);
    }
    .change-card:focus-visible {
      outline: 2px solid rgba(246, 196, 76, 0.6);
      outline-offset: 4px;
    }
    /* 全屏时的 body 背景色 */
    .fullscreen {
      background-color: #000; /* 全屏时黑色背景 */
      --change-up-color: #ff6b6b;
      --change-down-color: #3ddc97;
    }
    /* 全屏按钮样式，居中显示，轻拟物风格 */
    #fullscreenButton {
      position: fixed;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: linear-gradient(145deg, #fdfdfd, #d7d7d7);
      box-shadow: 6px 6px 12px rgba(0, 0, 0, 0.15),
                  -6px -6px 12px rgba(255, 255, 255, 0.6);
      color: #505050;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #fullscreenButton:active {
      transform: translateX(-50%) translateY(2px);
      box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.2),
                  inset -4px -4px 8px rgba(255, 255, 255, 0.7);
    }
    /* Width and height both constrain the display, including XS landscape. */
    body { padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left); box-sizing: border-box; }
    #backgroundChart { height: var(--app-height); opacity: 1; }
    .container { width: 84%; height: auto; padding: 0; gap: clamp(8px, 2vh, 24px); }
    .price { margin: 0; font-size: min(5.5vw, 12vh); line-height: 1.12; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .time { margin: 0; font-size: min(2.1vw, 4.5vh); line-height: 1.3; white-space: nowrap; }
    .status { font-size: min(2.5vw, 5vh); line-height: 1.3; text-align: center; }
    .change-board { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(6px, 1vw, 16px); margin-top: 0; }
    .change-card { min-width: 0; padding: min(1vw, 1.6vh); gap: min(.6vw, 1vh); box-sizing: border-box; }
    .change-card .period { font-size: min(2vw, 4.5vh); white-space: nowrap; }
    .change-card .change-value { line-height: 1.15; gap: .25em; padding: 0; font-size: min(2.8vw, 5vh); }
    .change-card .change-arrow { font-size: .8em; min-width: 0; }
    .change-card .change-lines { gap: 0; }
    .change-card .change-line:first-child { font-size: 1em; white-space: nowrap; }
    .change-card .change-line:last-child { font-size: .8em; }
    .change-card .change-extra { font-size: min(1.6vw, 3.5vh); white-space: nowrap; }
    .change-card .indicator { width: 6px; height: 6px; top: 7px; right: 7px; }
    #fullscreenButton { bottom: calc(var(--safe-bottom) + 12px); padding: 7px 20px; font-size: 13px; }
    .chart-description { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    @media (max-width: 600px) and (orientation: portrait) {
      .container { width: 94%; gap: 18px; }
      .price { font-size: 8vw; }
      .time { font-size: 3.6vw; }
      .status { font-size: 4.6vw; }
      .change-card { padding: 14px 4px 10px; gap: 8px; }
      .change-card .period { font-size: 3.6vw; }
      .change-card .change-value { font-size: 5vw; }
      .change-card .change-extra { font-size: 2.9vw; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .container { width: 94%; gap: 5px; }
      .price { font-size: min(8.5vw, calc(var(--app-height) * .17)); line-height: 1.05; }
      .time { font-size: 15px; line-height: 1.2; }
      .status { font-size: 18px; line-height: 1.2; }
      .change-board { gap: 10px; margin-top: 7px; }
      .change-card { padding: 8px 10px; gap: 3px; border-radius: 10px; }
      .change-card .period { font-size: 18px; }
      .change-card .change-value { font-size: 28px; line-height: 1.05; }
      .change-card .change-line:last-child { font-size: 19px; }
      .change-card .change-extra { font-size: 13px; }
      .change-card .change-lines { flex-direction: row; align-items: baseline; gap: 8px; }
      .history-status { font-size: 11px; }
      #fullscreenButton { left: auto; right: calc(var(--safe-right) + 12px); top: calc(var(--safe-top) + 2px); bottom: auto; transform: none; padding: 4px 12px; }
    }
    @media (orientation: landscape) and (max-height: 320px) {
      .price { font-size: min(8.5vw, calc(var(--app-height) * .16)); }
      .time { font-size: 13px; }
      .status { font-size: 16px; }
      .change-card { padding: 6px 8px; }
      .change-card .period { font-size: 16px; }
      .change-card .change-value { font-size: 26px; }
      .change-card .change-line:last-child { font-size: 17px; }
    }
    .fullscreen .change-card { background: rgba(28, 26, 20, .72); box-shadow: inset 0 0 0 1px rgba(212,175,55,.18); }
    .fullscreen .change-card.active { box-shadow: inset 0 0 0 1px rgba(212,175,55,.55); }
    /* Bound the whole display to Safari's visible viewport, not 100vw. */
    body { width: var(--app-width, 100%); min-width: 0; }
    #backgroundChart { width: var(--app-width, 100%); }
    .container { min-width: 0; max-width: calc(100% - 24px); }
    .change-board, .change-lines { min-width: 0; }
    @media (orientation: landscape) and (max-height: 500px) {

      .container { width: calc(100% - 24px); }
      .change-card .change-lines { flex-wrap: wrap; justify-content: center; column-gap: 8px; row-gap: 0; }
      .change-card .change-value { flex-wrap: wrap; }
    }
    /* Safari owns notch containment; do not subtract its horizontal insets twice. */
    .ios { --safe-left: 0px; --safe-right: 0px; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #f0f0f0; }
  </style>
</head>
<body>
  <canvas id="backgroundChart" aria-hidden="true"></canvas>
  <div class="chart-description" aria-live="polite"></div>
  <div class="container">
    <div class="price">加载中...</div>
    <div class="time"></div>
    <div class="status" aria-live="polite">状态加载中...</div>
    <div class="history-status" aria-live="polite"></div>
    <div class="change-board" aria-live="polite">
      <div class="change-card active" data-card-period="day" role="button" tabindex="0" aria-pressed="true">
        <span class="indicator" aria-hidden="true"></span>
        <div class="period">过去 24H</div>
        <div class="change-value" data-period="day">—</div>
        <div class="change-extra" data-extra="day">—</div>
      </div>
      <div class="change-card" data-card-period="week" role="button" tabindex="0" aria-pressed="false">
        <span class="indicator" aria-hidden="true"></span>
        <div class="period">过去 7 天</div>
        <div class="change-value" data-period="week">—</div>
        <div class="change-extra" data-extra="week">—</div>
      </div>
      <div class="change-card" data-card-period="month" role="button" tabindex="0" aria-pressed="false">
        <span class="indicator" aria-hidden="true"></span>
        <div class="period">过去 30 天</div>
        <div class="change-value" data-period="month">—</div>
        <div class="change-extra" data-extra="month">—</div>
      </div>
    </div>

  </div>
  <!-- 全屏按钮，悬浮在底部居中 -->
  <button id="fullscreenButton">全屏</button>
  <script src="price-model.js?v=20260914"></script>
  <script src="chart-layout.js?v=20260922-safari2"></script>
  <script src="script.js?v=20260922-safari2"></script>
</body>
</html>
