<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f0f0f0">
  <title>行情看板 · 黄金 / 比特币 / 股票</title>
  <style>
    :root {
      --app-height: 100vh;
      --app-left: 0px;
      --app-top: 0px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --change-up-color: #d95c5c;
      --change-down-color: #259f70;
      --change-neutral-color: #947427;
      --muted-color: #806d45;
      --control-background: #ffffffd9;
      --control-border: #b88e2038;
    }
    @supports (height: 100dvh) { :root { --app-height: 100dvh; } }
    html, body { overflow: hidden; overscroll-behavior: none; }
    html { height: 100%; background: #f0f0f0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f0f0f0;
      color: #d4af37;
      display: flex;
      justify-content: center;
      align-items: center;
      width: var(--app-width, 100%);
      height: var(--app-height);
      min-width: 0;
      position: fixed;
      left: var(--app-left);
      top: var(--app-top);
      touch-action: manipulation;
    }
    /* One coordinate system: the background fills the viewport; only foreground avoids the notch. */
    #backgroundChart {
      position: absolute; top: 0; left: 0;
      width: var(--app-width, 100%); height: var(--app-height);
      z-index: 0; pointer-events: none;
    }
    .container {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      width: min(1000px, calc(100% - 32px)); min-width: 0;
      gap: clamp(10px, 2vh, 22px); text-align: center;
    }
    .asset-label { font-size: 13px; font-weight: 600; color: var(--muted-color); }
    .price {
      margin: 0; font-size: clamp(38px, min(8vw, 14vh), 112px);
      font-weight: 650; letter-spacing: -.035em; line-height: 1.06;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .price-unit { font-size: .25em; font-weight: 500; letter-spacing: 0; opacity: .78; }
    .quote-meta { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
    .time { margin: 0; font-size: 14px; line-height: 1.4; color: var(--muted-color); white-space: nowrap; }
    .status { font-size: 14px; font-weight: 500; line-height: 1.4; }
    .status.stopped { color: #d95c5c; }
    .status.active { color: #259f70; }
    .asset-source { font-size: 11px; line-height: 1.4; color: var(--muted-color); }
    .history-status { font-size: 12px; line-height: 1.4; color: #a36b38; }
    .history-status:empty { display: none; }
    .change-board { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .change-card {
      position: relative; min-width: 0; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 18px 12px; border: 1px solid #b88e2026; border-radius: 16px;
      background: #ffffffbf; cursor: pointer;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      touch-action: manipulation; font-variant-numeric: tabular-nums;
    }
    .change-card.active { border-color: #b88e208c; box-shadow: inset 0 -2px 0 #b88e2059; }
    .change-card .period { font-size: 14px; line-height: 1.25; color: var(--muted-color); white-space: nowrap; }
    .change-value { display: flex; align-items: center; justify-content: center; gap: .25em;
      font-size: clamp(20px, 3vw, 34px); font-weight: 650; line-height: 1.1; color: var(--change-neutral-color); }
    .change-up { color: var(--change-up-color); }
    .change-down { color: var(--change-down-color); }
    .change-flat { color: var(--change-neutral-color); }
    .change-arrow { font-size: .65em; line-height: 1; }
    .change-lines { display: flex; flex-direction: row; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 2px 8px; min-width: 0; }
    .change-line:first-child { white-space: nowrap; }
    .change-line:last-child { font-size: .52em; font-weight: 500; opacity: .85; }
    .change-extra { font-size: 12px; line-height: 1.3; color: var(--muted-color); white-space: nowrap; }
    .indicator { position: absolute; top: 12px; right: 12px; width: 5px; height: 5px; border-radius: 50%; background: #a3987940; }
    .change-card.active .indicator { background: #d4af37; }
    button:focus-visible, .change-card:focus-visible { outline: 2px solid #d4af37; outline-offset: 4px; }
    #assetSwitchButton, #fullscreenButton {
      position: absolute; z-index: 1000; box-sizing: border-box;
      min-height: 44px; padding: 8px 16px; border-radius: 999px;
      border: 1px solid var(--control-border); background: var(--control-background);
      color: var(--muted-color); font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #assetSwitchButton { top: calc(var(--safe-top) + 4px); left: calc(var(--safe-left) + 12px); max-width: 45%; }
    #fullscreenButton { width: 96px; min-height: 48px; bottom: calc(var(--safe-bottom) + 12px); left: 50%; transform: translateX(-50%);
      touch-action: none; -webkit-user-select: none; user-select: none; }
    #assetSwitchButton:active, #fullscreenButton:active { border-color: #d4af37; }
    .fullscreen {
      background: #000; --muted-color: #b5a373;
      --change-up-color: #ff7373; --change-down-color: #4bd7a0;
      --control-background: #17160ee6; --control-border: #d4af3738;
    }
    .fullscreen .price { text-shadow: 0 2px 24px #000; }
    .fullscreen .change-card { background: #12120ee6; border-color: #d4af3726; }
    .fullscreen .change-card.active { background: #1a180fe6; border-color: #d4af376b; box-shadow: inset 0 -2px 0 #d4af3760; }
    .fullscreen .status.active { color: #4bd7a0; }
    .chart-description { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    @media (max-width: 600px) and (orientation: portrait) {
      .container { width: calc(100% - 24px); gap: 18px; }
      .price { font-size: 14vw; }
      .quote-meta { flex-direction: column; gap: 5px; }
      .time { font-size: 12px; }
      .status { font-size: 13px; }
      .change-board { gap: 7px; }
      .change-card { padding: 16px 4px 14px; gap: 10px; border-radius: 12px; }
      .change-card .period { font-size: 12px; }
      .change-value { font-size: 5.6vw; }
      .change-lines { flex-direction: column; align-items: center; gap: 4px; }
      .change-line:last-child { font-size: .65em; }
      .change-extra { font-size: 10px; }
      .indicator { top: 8px; right: 8px; }
      .asset-source { max-width: 95%; font-size: 10px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .container { gap: 10px; }
      .asset-label { display: none; }
      .price { font-size: min(11vw, calc(var(--app-height) * .215)); }
      .time, .status { font-size: 13px; }
      .change-board { margin-top: 8px; }
      .change-card { padding: 13px 12px; gap: 9px; border-radius: 13px; }
      .change-card .period { font-size: 13px; }
      .change-value { font-size: 30px; }
      .change-extra { font-size: 11px; }
      .asset-source, .history-status { font-size: 10px; }
      #fullscreenButton { left: auto; right: calc(var(--safe-right) + 12px); top: calc(var(--safe-top) + 4px); bottom: auto; transform: none; }
    }
    @media (orientation: landscape) and (max-height: 320px) {
      .container { gap: 7px; }
      .price { font-size: min(10vw, calc(var(--app-height) * .20)); }
      .time, .status { font-size: 12px; }
      .change-board { margin-top: 3px; }
      .change-card { padding: 10px 10px; gap: 7px; }
      .change-value { font-size: 26px; }
      .change-extra { font-size: 10px; }
    }
    #assetDialog { width: min(440px, calc(100vw - var(--safe-left) - var(--safe-right) - 32px));
      max-height: calc(var(--app-height) - var(--safe-top) - var(--safe-bottom) - 24px); overflow: auto;
      box-sizing: border-box; padding: 20px; border: 1px solid #d4af3760; border-radius: 20px;
      background: #f8f6ef; color: #514321; box-shadow: 0 12px 50px #0004; }
    #assetDialog::backdrop { background: #0005; }
    .dialog-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .dialog-heading h2 { margin: 0; font-size: 20px; }
    #closeAssetDialog { border: 0; background: transparent; padding: 4px 8px; font-size: 24px; color: #514321; cursor: pointer; }
    .asset-options { display: flex; gap: 8px; margin-bottom: 16px; }
    .asset-options button, .saved-stocks button { border: 1px solid #d4af3760; border-radius: 12px; background: #fff9; padding: 10px 14px; color: #80631b; font-size: 16px; cursor: pointer; }
    .asset-options button { flex: 1; }
    .asset-options button[aria-pressed="true"], .saved-stocks button[aria-pressed="true"] { background: #d4af37; color: #fff; }
    #stockForm label { display: block; font-size: 14px; margin-bottom: 8px; }
    .stock-entry { display: flex; gap: 8px; }
    #stockMarket, #stockSymbol { box-sizing: border-box; min-width: 0; border: 1px solid #d4af3760; border-radius: 10px; padding: 10px 8px; background: #fff; color: #514321; font-size: 16px; }
    #stockMarket { width: 100px; }
    #stockSymbol { flex: 1; width: 100%; }
    #stockForm button[type="submit"] { width: 100%; margin-top: 10px; border: 0; border-radius: 10px; padding: 10px; background: #b88e20; color: #fff; font-size: 16px; cursor: pointer; }
    .stock-help { margin: 10px 0; font-size: 12px; line-height: 1.5; color: #7b725f; }
    .saved-stocks { display: flex; gap: 6px; flex-wrap: wrap; }
    .saved-stocks button { padding: 7px 10px; font-size: 13px; }
    #stockError { margin: 8px 0 0; color: #b33636; font-size: 13px; }
    #stockError:empty { display: none; }
    @media (orientation: landscape) and (max-height: 500px) {
      .asset-label { font-size: 12px; }
      .asset-source { font-size: 10px; }
    }
  </style>
</head>
<body>
  <canvas id="backgroundChart" aria-hidden="true"></canvas>
  <div class="chart-description" aria-live="polite"></div>
  <div class="container">
    <div class="asset-label">黄金</div>
    <div class="price">加载中...</div>
    <div class="quote-meta">
      <div class="time"></div>
      <div class="status" aria-live="polite">状态加载中...</div>
    </div>
    <div class="history-status" aria-live="polite"></div>
    <div class="change-board" aria-live="polite">
      <div class="change-card active" data-card-period="day" role="button" tabindex="0" aria-pressed="true">
        <span class="indicator" aria-hidden="true"></span>
        <div class="period">过去 24H</div>
        <div class="change-value" data-period="day">—</div>
        <div class="change-extra" data-extra="day">—</div>
      </div>
      <div class="change-card" data-card-period="week" role="button" tabindex="0" aria-pressed="false">
        <span class="indicator" aria-hidden="true"></span>
        <div class="period">过去 7 天</div>
        <div class="change-value" data-period="week">—</div>
        <div class="change-extra" data-extra="week">—</div>
      </div>
      <div class="change-card" data-card-period="month" role="button" tabindex="0" aria-pressed="false">
        <span class="indicator" aria-hidden="true"></span>
        <div class="period">过去 30 天</div>
        <div class="change-value" data-period="month">—</div>
        <div class="change-extra" data-extra="month">—</div>
      </div>
    </div>
    <div class="asset-source">World Gold Council · CNY/克</div>
  </div>
  <button id="assetSwitchButton" aria-haspopup="dialog" aria-controls="assetDialog">黄金 ▾</button>
  <dialog id="assetDialog" aria-labelledby="assetDialogTitle">
    <div class="dialog-heading"><h2 id="assetDialogTitle">切换行情</h2><button id="closeAssetDialog" aria-label="关闭">×</button></div>
    <div class="asset-options" aria-label="资产类型">
      <button type="button" data-asset="gold" aria-pressed="true">黄金</button>
      <button type="button" data-asset="bitcoin" aria-pressed="false">比特币</button>
    </div>
    <form id="stockForm">
      <label for="stockSymbol">股票代码</label>
      <div class="stock-entry">
        <select id="stockMarket" aria-label="股票市场"><option value="auto">自动识别</option><option value="US">美股</option><option value="SH">沪股</option><option value="SZ">深股</option><option value="HK">港股</option></select>
        <input id="stockSymbol" type="text" placeholder="AAPL / 600519 / 0700.HK" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      </div>
      <button type="submit">查看股票行情</button>
      <p id="stockError" role="alert"></p>
    </form>
    <p class="stock-help">支持美股、A 股及港股。股票和比特币使用各自报价币种，行情可能延迟，曲线按 30 分钟采样。</p>
    <div id="savedStocks" class="saved-stocks" aria-label="已选及常用股票"></div>
  </dialog>
  <!-- 全屏按钮，悬浮在底部居中 -->
  <button id="fullscreenButton" type="button" aria-pressed="false">全屏</button>
  <script src="price-model.js?v=20260914"></script>
  <script src="market-model.js?v=20261009-mobile2"></script>
  <script src="chart-layout.js?v=20261009-touch3"></script>
  <script src="script.js?v=20261009-touch3"></script>
</body>
</html>
